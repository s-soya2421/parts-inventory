name: Safe Cloudflare auto deploy (web-only, opt-in)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  classify:
    # A fork must never deploy to the canonical Worker's production account.
    if: github.repository == 'nyokkirokki/parts-inventory'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regression test conservative release classification
        run: node --test tests/automation/release-policy.test.mjs
      - name: Determine whether this commit is web-only
        id: release
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node scripts/classify-release.mjs "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  verify:
    needs: classify
    if: needs.classify.outputs.mode == 'auto' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      E2E_BASIC_AUTH_USER: e2e
      E2E_BASIC_AUTH_PASSWORD: test-only-secret
      E2E_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify update policy
        run: node --test tests/automation/release-policy.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Unit and real SQLite integration regression tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build and typecheck
        run: pnpm build
      - name: Install isolated Playwright runner
        run: npm install --prefix e2e --no-audit --no-fund
      - name: Install headless Chromium
        run: ./e2e/node_modules/.bin/playwright install chromium --with-deps
      - name: Prepare disposable local D1 migrations
        run: pnpm exec wrangler d1 migrations apply db-parts --local --persist-to .wrangler/state
      - name: Start authenticated local Worker
        run: |
          printf 'BASIC_AUTH_USER=%s\nBASIC_AUTH_PASSWORD=%s\n' "$E2E_BASIC_AUTH_USER" "$E2E_BASIC_AUTH_PASSWORD" > .dev.vars
          ./e2e/node_modules/.bin/wrangler dev --local --persist-to .wrangler/state --port 8787 --ip 127.0.0.1 > /tmp/worker-e2e.log 2>&1 &
          echo "$!" > /tmp/worker-e2e.pid
          for attempt in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/worker-e2e.pid)" 2>/dev/null; then
              cat /tmp/worker-e2e.log
              exit 1
            fi
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$E2E_BASIC_AUTH_USER:$E2E_BASIC_AUTH_PASSWORD" http://127.0.0.1:8787/api/health || true)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          cat /tmp/worker-e2e.log
          exit 1
      - name: Chromium desktop and mobile end-to-end regression tests
        run: npm --prefix e2e test
      - name: Stop test Worker before local D1 backup
        run: |
          kill "$(cat /tmp/worker-e2e.pid)" 2>/dev/null || true
          sleep 1
      - name: Verify D1 backup and restore, never against production
        run: |
          pnpm exec wrangler d1 execute db-parts --local --persist-to .wrangler/state \
            --command "INSERT INTO parts (category_id,model_number,name,stock_quantity) VALUES (2,'RELEASE-SENTINEL','Auto-deploy backup marker',123)"
          pnpm exec wrangler d1 export db-parts --local --output "$RUNNER_TEMP/backup-original.sql"
          node scripts/verify-d1-backup.mjs --source-dir .wrangler/state \
            --backup "$RUNNER_TEMP/backup-original.sql" --sentinel RELEASE-SENTINEL
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-deploy-e2e-failures
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: [classify, verify]
    if: needs.verify.result == 'success' && needs.classify.outputs.mode == 'auto' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      AUTH_USER: ${{ secrets.PRODUCTION_BASIC_AUTH_USER }}
      AUTH_PASS: ${{ secrets.PRODUCTION_BASIC_AUTH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate configured production target and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AUTH_USER"
          test -n "$AUTH_PASS"
          [[ "$PRODUCTION_BASE_URL" == https://* ]]
      - name: Refuse stale main commits
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$latest"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Newer main commit exists; refusing an obsolete deployment."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse deployment while remote D1 has pending migrations
        shell: bash
        run: |
          set -euo pipefail
          # Wrangler's 'list' lists only UNAPPLIED migrations. Never apply here.
          pending="$(pnpm exec wrangler d1 migrations list db-parts --remote 2>&1)"
          printf '%s\n' "$pending"
          if grep -E '[0-9]{4}_[A-Za-z0-9_-]+\.sql' <<< "$pending"; then
            echo "Pending remote migration: stopping before deploy."
            exit 1
          fi
      - name: Deploy the verified Worker and SPA without changing D1 schema
        run: |
          pnpm build
          pnpm exec wrangler deploy
      - name: Verify authenticated production health
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --user "$AUTH_USER:$AUTH_PASS" "$base/api/health" > "$RUNNER_TEMP/health.json"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(x.ok!==true||x.service!=="electronics-inventory")process.exit(1)' "$RUNNER_TEMP/health.json"
